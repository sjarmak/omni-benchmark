<!--
  The architecture figures are very wide (benchmarkSystem is 9288x2478, sealedFlow
  is 9294x1668). Inside the theme's 1012px column they render about 270px tall and
  the labels disappear. These rules let a figure break out of the column to the
  full viewport, cap a portrait figure by height instead of width, and mark the
  link so it reads as zoomable. Full resolution is one click away in every case.
-->
<style>
  .markdown-body p > a[href*="architecture/figures/"] {
    display: block;
    width: 100vw;
    max-width: 100vw;
    margin-left: calc(50% - 50vw);
    cursor: zoom-in;
  }
  .markdown-body p > a[href*="architecture/figures/"] img {
    display: block;
    margin: 0 auto;
    width: auto;
    max-width: 100%;
    max-height: 80vh;
    background: #fff;
  }
</style>
