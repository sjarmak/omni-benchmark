name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    # Setup is 7 seconds; the test step is the whole budget. Run 33420484237
    # was killed at the previous 30-minute cap having reached 76% of the suite,
    # which puts the full step near 40 minutes on a 4-vCPU runner. 60 leaves
    # real headroom and still kills a hang. See omni-benchmark-cd2 for making
    # the suite faster rather than raising this again.
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests with branch coverage
        run: uv run --frozen pytest --cov=omni_benchmark --cov-branch

      - name: Run Ruff
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .
